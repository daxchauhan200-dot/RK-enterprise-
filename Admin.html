<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK ENTERPRISE - એડમિન ડેશબોર્ડ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b19;
            --sidebar-bg: #0f1c3f;
            --gold-primary: #ffd700;
            --gold-gradient: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --danger-red: #ef4444;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Gujarati', 'Poppins', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-brand {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-brand h2 {
            color: var(--gold-primary);
            font-size: 1.5rem;
        }

        .menu-list {
            list-style: none;
            padding: 20px 15px;
            flex-grow: 1;
        }

        .menu-item {
            padding: 12px 18px;
            color: #cbd5e1;
            border-radius: 10px;
            font-weight: 600;
            background: var(--gold-gradient);
            color: var(--bg-dark);
            margin-bottom: 10px;
        }

        .back-btn {
            margin: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .back-btn:hover {
            background: white;
            color: var(--bg-dark);
        }

        /* Main Content */
        main {
            margin-left: 260px;
            flex-grow: 1;
            padding: 30px;
            max-width: 1200px;
        }

        .header-box {
            background: white;
            padding: 20px 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: var(--bg-dark);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
        }

        .thumb {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .del-btn {
            background: #fee2e2;
            color: var(--danger-red);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .del-btn:hover {
            background: var(--danger-red);
            color: white;
        }

        .preview-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
            border: 2px solid var(--gold-primary);
        }

        @media (max-width: 800px) {
            aside { width: 70px; }
            .sidebar-brand h2, .back-btn span, .menu-item span { display: none; }
            main { margin-left: 70px; padding: 15px; }
            .grid-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside>
    <div class="sidebar-brand">
        <h2>RK</h2>
        <span style="font-size: 0.75rem; color: #94a3b8;">એડમિન પેનલ</span>
    </div>
    <ul class="menu-list">
        <li class="menu-item">📦 <span>પ્રોડક્ટ્સ</span></li>
    </ul>
    <a href="index.html" class="back-btn">
        🌐 <span>વેબસાઈટ જુઓ</span>
    </a>
</aside>

<main>
    <div class="header-box">
        <h1>એડમિન ડેશબોર્ડ</h1>
        <p id="total-count" style="font-weight: bold; color: var(--text-muted);">કુલ પ્રોડક્ટ્સ: 0</p>
    </div>

    <div class="grid-layout">
        <!-- Form -->
        <div class="card">
            <h2>➕ નવી પ્રોડક્ટ ઉમેરો</h2>
            <form id="product-form">
                <div class="form-group">
                    <label>પ્રોડક્ટનું નામ</label>
                    <input type="text" id="p-name" placeholder="દા.ત. પંચમુખી હનુમાન" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>કેટેગરી</label>
                        <select id="p-category">
                            <option value="મૂર્તિ">મૂર્તિઓ</option>
                            <option value="કડા">કડા</option>
                            <option value="વેડલા">વેડલા</option>
                            <option value="ઝાંઝર">ઝાંઝર</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ધાતુ</label>
                        <select id="p-metal">
                            <option value="પિત્તળ (Brass)">પિત્તળ (Brass)</option>
                            <option value="જર્મન સિલ્વર">જર્મન સિલ્વર</option>
                            <option value="સિલ્વર">સિલ્વર</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>કિંમત (₹)</label>
                        <input type="number" id="p-price" placeholder="2000" required>
                    </div>
                    <div class="form-group">
                        <label>વજન / સાઈઝ</label>
                        <input type="text" id="p-weight" placeholder="દા.ત. 500 ગ્રામ">
                    </div>
                </div>
                <div class="form-group">
                    <label>ફોટો અપલોડ કરો</label>
                    <input type="file" id="p-image-file" accept="image/*" required>
                    <input type="hidden" id="p-image-url">
                    <div id="image-preview"></div>
                </div>
                <div class="form-group">
                    <label>વર્ણન</label>
                    <textarea id="p-desc" placeholder="પ્રોડક્ટ વિશે માહિતી લખો..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">💾 પ્રોડક્ટ સેવ કરો</button>
            </form>
        </div>

        <!-- Table -->
        <div class="card">
            <h2>📋 પ્રોડક્ટ્સ લિસ્ટ</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ફોટો</th>
                            <th>નામ & વિગત</th>
                            <th>કિંમત</th>
                            <th>એક્શન</th>
                        </tr>
                    </thead>
                    <tbody id="product-tbody">
                        <tr><td colspan="4" style="text-align: center; color: #94a3b8;">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    const STORAGE_KEY = 'shree_shiv_shakti_products';
    let products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const form = document.getElementById('product-form');
    const imageFile = document.getElementById('p-image-file');
    const imageUrl = document.getElementById('p-image-url');
    const imagePreview = document.getElementById('image-preview');

    // ફોટો રીડર
    imageFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imageUrl.value = event.target.result;
                imagePreview.innerHTML = `<img src="${event.target.result}" class="preview-img">`;
            }
            reader.readAsDataURL(file);
        }
    });

    // ફોર્મ સબમિટ
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const newProd = {
            id: 'prod_' + Date.now(),
            name: document.getElementById('p-name').value.trim(),
            category: document.getElementById('p-category').value,
            metal: document.getElementById('p-metal').value,
            price: parseFloat(document.getElementById('p-price').value),
            weight: document.getElementById('p-weight').value.trim(),
            description: document.getElementById('p-desc').value.trim(),
            imageUrl: imageUrl.value,
            images: [imageUrl.value]
        };

        products.unshift(newProd);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        
        alert('પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!');
        form.reset();
        imagePreview.innerHTML = '';
        render();
    });

    // પ્રોડક્ટ ડિલીટ
    function deleteProduct(id) {
        if (confirm('શું તમે આ પ્રોડક્ટ ડિલીટ કરવા માંગો છો?')) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
            render();
        }
    }

    // રેન્ડર ફંક્શન
    function render() {
        const tbody = document.getElementById('product-tbody');
        tbody.innerHTML = '';

        document.getElementById('total-count').innerText = "કુલ પ્રોડક્ટ્સ: " + products.length;

        if (products.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">હાલ કોઈ પ્રોડક્ટ ઉમેરેલી નથી.</td></tr>`;
            return;
        }

        products.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${p.imageUrl}" class="thumb"></td>
                <td>
                    <strong>${p.name}</strong><br>
                    <small style="color: #64748b;">${p.category} • ${p.metal}</small>
                </td>
                <td><strong>₹${Number(p.price).toLocaleString('en-IN')}</strong></td>
                <td>
                    <button class="del-btn" onclick="deleteProduct('${p.id}')">ડિલીટ</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    render();
</script>

</body>
</html>
