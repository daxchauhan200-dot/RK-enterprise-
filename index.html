<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>શ્રી શિવ શક્તિ જ્વેલર્સ - પરંપરાગત અને આધુનિક આભૂષણો</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0f172a;
            --secondary-dark: #1e293b;
            --gold: #d4af37;
            --gold-light: #fef08a;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --whatsapp: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Gujarati', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Navbar */
        nav {
            background: var(--primary-dark);
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--gold);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
        }

        .admin-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .admin-link:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1350&q=80') center/cover;
            color: white;
            text-align: center;
            padding: 70px 20px;
            border-bottom: 4px solid var(--gold);
        }

        .hero h1 {
            font-size: 36px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            color: #e2e8f0;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Filter Section */
        .filter-container {
            max-width: 1200px;
            margin: 30px auto 10px;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: white;
            border: 1.5px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-dark);
            color: var(--gold);
            border-color: var(--primary-dark);
        }

        /* Catalog Grid */
        .catalog-container {
            max-width: 1200px;
            margin: 20px auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .product-img-wrapper {
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary-dark);
            color: var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .product-details {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .product-weight {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 14px;
            color: #475569;
            margin-bottom: 15px;
            line-height: 1.5;
            flex: 1;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .btn-order {
            background: var(--whatsapp);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn-order:hover {
            opacity: 0.9;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        footer {
            background: var(--primary-dark);
            color: #94a3b8;
            text-align: center;
            padding: 25px;
            border-top: 2px solid var(--gold);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">✨ શ્રી શિવ શક્તિ જ્વેલર્સ</a>
        <a href="admin.html" class="admin-link">⚙️ એડમિન લોગીન</a>
    </nav>

    <section class="hero">
        <h1>શુદ્ધતા અને પરંપરાનો સંગમ</h1>
        <p>ભરવાડના કડા, વેડલા, ઝાંઝર, બ્રાસ અને જર્મન સિલ્વરના બેનમૂન આભૂષણોના ઉત્પાદક અને વિક્રેતા.</p>
    </section>

    <!-- Category Filters -->
    <div class="filter-container" id="filterButtons">
        <button class="filter-btn active" onclick="filterProducts('All', this)">બધી પ્રોડક્ટ્સ</button>
        <button class="filter-btn" onclick="filterProducts('ભરવાડના કડા', this)">ભરવાડના કડા</button>
        <button class="filter-btn" onclick="filterProducts('વેડલા', this)">વેડલા</button>
        <button class="filter-btn" onclick="filterProducts('ઝાંઝર', this)">ઝાંઝર</button>
        <button class="filter-btn" onclick="filterProducts('બ્રાસ જ્વેલરી', this)">બ્રાસ જ્વેલરી</button>
        <button class="filter-btn" onclick="filterProducts('જર્મન સિલ્વર', this)">જર્મન સિલ્વર</button>
    </div>

    <!-- Product Grid -->
    <main class="catalog-container" id="publicProductGrid">
        <!-- અહીં પ્રોડક્ટ્સ ઓટોમેટિક દેખાશે -->
    </main>

    <footer>
        <p>© 2026 શ્રી શિવ શક્તિ જ્વેલર્સ. સર્વ હક્ક સ્વાધીન.</p>
    </footer>

    <script>
        // એડમિન પેજ વાળી જ STORAGE KEY
        const STORAGE_KEY = 'shree_shiv_shakti_products';
        
        // તમારો WhatsApp નંબર અહીં નાખવો (91 સાથે)
        const WHATSAPP_NUMBER = "919876543210"; 

        document.addEventListener('DOMContentLoaded', () => {
            displayProducts('All');
        });

        // જો બીજા ટેબમાં એડમિન પેજ પર ફેરફાર થાય, તો અહીં તરત જ અપડેટ થશે
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                displayProducts('All');
            }
        });

        function displayProducts(categoryFilter) {
            const grid = document.getElementById('publicProductGrid');
            const rawData = localStorage.getItem(STORAGE_KEY);
            let products = rawData ? JSON.parse(rawData) : [];

            if (categoryFilter !== 'All') {
                products = products.filter(p => p.category === categoryFilter);
            }

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3 style="color: #334155; margin-bottom: 10px;">હાલમાં આ કેટેગરીમાં કોઈ પ્રોડક્ટ ઉપલબ્ધ નથી.</h3>
                        <p style="color: #64748b;">એડમિન પેનલમાંથી નવી પ્રોડક્ટ ઉમેરો, તે તરત જ અહીં દેખાશે.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(product => {
                const whatsappMsg = encodeURIComponent(`નમસ્તે શ્રી શિવ શક્તિ જ્વેલર્સ, મને તમારી આ પ્રોડક્ટ ખરીદવામાં રસ છે:\n*નામ:* ${product.name}\n*કેટેગરી:* ${product.category}\n*કિંમત:* ₹${product.price}`);
                
                return `
                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="category-tag">${product.category}</span>
                            <img src="${product.image}" alt="${product.name}">
                        </div>
                        <div class="product-details">
                            <h3 class="product-title">${product.name}</h3>
                            ${product.weight ? `<div class="product-weight">⚖️ ${product.weight}</div>` : ''}
                            <p class="product-desc">${product.desc || 'ઉત્તમ ગુણવત્તા અને આકર્ષક ફિનિશિંગ સાથેનું આભૂષણ.'}</p>
                            <div class="product-footer">
                                <span class="price">₹${product.price}</span>
                                <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${whatsappMsg}" target="_blank" class="btn-order">
                                    💬 ઓર્ડર કરો
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterProducts(category, btnElement) {
            // બધા બટન પરથી active ક્લાસ હટાવો
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            // ક્લિક કરેલા બટન પર active ક્લાસ લગાવો
            btnElement.classList.add('active');
            
            displayProducts(category);
        }
    </script>
</body>
</html>
